<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Dark background -->
  <rect width="80" height="80" rx="16" fill="#0F172A"/>

  <!-- Scan corner frame - blue -->
  <!-- Top-left -->
  <path d="M8 22 L8 8 L22 8" stroke="#3B6EF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-right -->
  <path d="M58 8 L72 8 L72 22" stroke="#3B6EF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-left -->
  <path d="M8 58 L8 72 L22 72" stroke="#3B6EF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-right -->
  <path d="M58 72 L72 72 L72 58" stroke="#3B6EF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- QR finder squares -->
  <!-- Top-left finder -->
  <rect x="15" y="15" width="16" height="16" rx="2" fill="white"/>
  <rect x="19" y="19" width="8" height="8" rx="1" fill="#0F172A"/>
  <!-- Top-right finder -->
  <rect x="49" y="15" width="16" height="16" rx="2" fill="white"/>
  <rect x="53" y="19" width="8" height="8" rx="1" fill="#0F172A"/>
  <!-- Bottom-left finder -->
  <rect x="15" y="49" width="16" height="16" rx="2" fill="white"/>
  <rect x="19" y="53" width="8" height="8" rx="1" fill="#0F172A"/>

  <!-- QR data dots -->
  <rect x="35" y="15" width="5" height="5" rx="1" fill="white"/>
  <rect x="42" y="15" width="5" height="5" rx="1" fill="white"/>
  <rect x="35" y="22" width="5" height="5" rx="1" fill="white"/>
  <rect x="15" y="35" width="5" height="5" rx="1" fill="white"/>
  <rect x="22" y="35" width="5" height="5" rx="1" fill="white"/>
  <rect x="35" y="35" width="5" height="5" rx="1" fill="white"/>
  <rect x="42" y="35" width="5" height="5" rx="1" fill="white"/>
  <rect x="35" y="42" width="5" height="5" rx="1" fill="white"/>
  <rect x="42" y="42" width="5" height="5" rx="1" fill="white"/>
  <rect x="35" y="49" width="5" height="5" rx="1" fill="white"/>
  <rect x="42" y="49" width="5" height="5" rx="1" fill="white"/>
  <rect x="35" y="56" width="5" height="5" rx="1" fill="white"/>
  <rect x="42" y="56" width="5" height="5" rx="1" fill="white"/>

  <!-- Shield badge (bottom-right overlay) -->
  <path d="M50 44 L50 44 L62 40 L74 44 L74 52 C74 57 68 62 62 64 C56 62 50 57 50 52 Z" fill="#3B6EF8"/>
  <!-- Check mark in shield -->
  <path d="M57 52 L60.5 55.5 L67 48" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
